<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitOps - Smart Transport Live Map</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- TomTom Maps SDK (Primary Provider) -->
    <link rel="stylesheet" type="text/css" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">
    <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
    <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/services/services-web.min.js"></script>

    <!-- Leaflet & OpenStreetMap (Fallback Provider) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Sleek Enterprise GIS UI Styles -->
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.9);
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --text-main: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: rgba(75, 85, 99, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Float Panels Styling (Glassmorphism & Sleek Design) */
        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }

        /* 1. Navigation Controller (Top Left) */
        #nav-controller {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 400px;
            padding: 24px;
        }

        #nav-controller h2 {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }

        #nav-controller h2 svg {
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }

        .flex-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .flex-row .form-control {
            flex-grow: 1;
        }

        .btn {
            padding: 12px 16px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #374151;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        /* 2. Destination Search Dropdown Suggestions */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 220px;
            overflow-y: auto;
            list-style: none;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .suggestions-box li {
            padding: 12px 16px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid rgba(75, 85, 99, 0.2);
            transition: background 0.2s;
        }

        .suggestions-box li:last-child {
            border-bottom: none;
        }

        .suggestions-box li:hover {
            background: var(--accent-color);
            color: white;
        }

        /* 3. Navigation Output Summary (Bottom Left) */
        #route-summary {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 400px;
            padding: 20px;
            display: none; /* Renders only when route is computed */
        }

        #route-summary h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .summary-item {
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .summary-item span {
            display: block;
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 4px;
        }

        /* 4. Active GIS Provider Status (Top Right) */
        #provider-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            background: rgba(16, 185, 129, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #provider-status.fallback {
            background: rgba(245, 158, 11, 0.9);
        }

        /* 5. Incidents Card (Bottom Right) */
        #incidents-panel {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 320px;
            padding: 18px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }

        #incidents-panel h4 {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .incident-item {
            font-size: 12px;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .incident-item:last-child {
            margin-bottom: 0;
        }

        .incident-severity {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .severity-high { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .severity-medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- GIS Map Engine -->
        <div id="map"></div>

        <!-- GIS Provider Status -->
        <div id="provider-status" class="glass-panel">
            <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:white;"></span>
            <span id="provider-text">Establishing Connection...</span>
        </div>

        <!-- Action Buttons (Top Right, below provider status) -->
        <div id="action-controls" class="glass-panel" style="position: absolute; top: 70px; right: 20px; padding: 12px; display: flex; gap: 8px; flex-direction: column;">
            <button id="btnRefreshMap" class="btn" style="padding: 8px 12px; font-size: 12px; background: #10b981;">🔄 Refresh Map</button>
            <button id="btnAssignTasks" class="btn btn-secondary" style="padding: 8px 12px; font-size: 12px;">📋 Assign Tasks</button>
        </div>

        <!-- Assignment Modal (Hidden by default) -->
        <div id="assignment-modal" class="glass-panel" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 24px; width: 350px; display: none; z-index: 200;">
            <h3 style="margin-bottom: 16px; color: var(--accent-color);">Assign Task to <span id="assign-truck-name" style="color:white;"></span></h3>
            <div class="form-group">
                <label>Start Location</label>
                <input type="text" id="assignStart" class="form-control" placeholder="e.g. Warehouse A">
            </div>
            <div class="form-group">
                <label>End Location</label>
                <input type="text" id="assignEnd" class="form-control" placeholder="e.g. Store B">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="btnSubmitTask" class="btn" style="flex: 1;">Assign</button>
                <button id="btnCancelTask" class="btn btn-secondary" style="flex: 1;">Cancel</button>
            </div>
        </div>

        <!-- 1. Navigation Panel (Top Left) -->
        <div id="nav-controller" class="glass-panel">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2 5.6-5.6 2 2-5.6 5.6-2z"/></svg>
                TransitOps GIS Map
            </h2>
            
            <div class="form-group">
                <label>Start Location</label>
                <div class="flex-row">
                    <input type="text" id="map-start-location" class="form-control" placeholder="Browser GPS Location" readonly>
                    <button id="btnChangeStart" type="button" class="btn btn-secondary">Change</button>
                </div>
            </div>

            <div class="form-group">
                <label>Search Destination</label>
                <input type="text" id="searchDest" class="form-control" placeholder="Type to search (e.g. Charminar)..." autocomplete="off">
                <ul id="search-autocomplete-list" class="suggestions-box" style="display: none;"></ul>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Transportation Way</label>
                <select id="travelMode" class="form-control" onchange="calculateRoute()">
                    <option value="truck">🚛 Truck (Heavy Vehicle)</option>
                    <option value="car" selected>🚗 Car (Standard Vehicle)</option>
                    <option value="motorcycle">🏍️ Motorbike</option>
                </select>
            </div>
        </div>

        <!-- 2. Stats Summary Card (Bottom Left) -->
        <div id="route-summary" class="glass-panel">
            <h3>
                <span class="pulse-dot"></span>
                Traffic-Aware Routing Live
            </h3>
            <div class="summary-grid">
                <div class="summary-item">Distance<span id="lblDist">--</span></div>
                <div class="summary-item">Travel Time<span id="lblTime">--</span></div>
                <div class="summary-item">Traffic Delay<span id="lblDelay">--</span></div>
                <div class="summary-item">Expected Arrival<span id="lblArrival">--</span></div>
                <div class="summary-item" style="grid-column: span 2;">Average Speed<span id="lblSpeed">--</span></div>
                <div id="routing-warning" style="grid-column: span 2; display: none; color: #fbbf24; font-size: 11px; font-weight: 500; margin-top: 5px; border-top: 1px solid rgba(75, 85, 99, 0.4); padding-top: 5px; line-height: 1.4;"></div>
            </div>
        </div>

        <!-- 3. Traffic Incidents Monitor (Bottom Right) -->
        <div id="incidents-panel" class="glass-panel">
            <h4>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/></svg>
                Traffic Incidents
            </h4>
            <div id="incidents-list"></div>
        </div>

    </div>

    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=9"></script>
</body>
</html>
